name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: pnpm

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if version already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@buchanan-solutions/ts-logkit@${{ steps.pkg.outputs.version }}" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.pkg.outputs.version }} already on registry — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.pkg.outputs.version }} not published — running release pipeline."
          fi

      - name: Install
        if: steps.check.outputs.published != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.check.outputs.published != 'true'
        run: pnpm test

      - name: Build
        if: steps.check.outputs.published != 'true'
        run: pnpm build

      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
