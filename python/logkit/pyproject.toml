[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buchanan-solutions-logkit"
version = "0.1.0"
description = "Buchanan Solutions logkit for Python — stdlib phased logging and debug HTTP parity"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Buchanan", email = "alex@buchanansolutions.ca" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=14"]
fastapi = ["fastapi>=0.121", "uvicorn>=0.38"]

[tool.hatch.build.targets.wheel]
packages = ["src/logkit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/logkit",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
