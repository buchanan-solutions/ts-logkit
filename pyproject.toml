[project]
name = "logkit-workspace"
version = "0.0.0"
requires-python = ">=3.13"
description = "UV workspace root for buchanan-solutions-logkit (not published)"

[tool.uv.workspace]
members = ["python/logkit", "python/logkit-mcp"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=0.23",
    "ruff>=0.15",
    "pyright>=1.1",
    "hatch>=1.16.5",
]
